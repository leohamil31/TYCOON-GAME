<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:transparent}svg{display:block}</style></head><body>
<svg id="s" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
const mode = location.hash.slice(1) || 'full'; // full | round | bg | fg
const C = { cyan:'#38bdf8', pink:'#ec4899', yellow:'#facc15', green:'#22c55e', orange:'#f97316', violet:'#8b5cf6' };
const shade = (hex, k) => { const n = parseInt(hex.slice(1),16); const f = (v)=>Math.max(0,Math.min(255,Math.round(v*k))); return `rgb(${f(n>>16)},${f((n>>8)&255)},${f(n&255)})`; };
function block(x, y, s, col) {
  const r = s*0.24, d = s*0.15, top = s-d;
  return `
  <g filter="url(#drop)">
    <rect x="${x}" y="${y}" width="${s}" height="${s}" rx="${r}" fill="${shade(col,0.52)}"/>
    <rect x="${x}" y="${y}" width="${s}" height="${top}" rx="${r}" fill="${col}"/>
    <rect x="${x+top*0.2}" y="${y+top*0.2}" width="${s-top*0.4}" height="${top*0.6}" rx="${r*0.6}" fill="${shade(col,1.14)}" stroke="rgba(255,255,255,0.22)" stroke-width="3"/>
    <rect x="${x+top*0.14}" y="${y+top*0.09}" width="${top*0.5}" height="${top*0.14}" rx="${top*0.07}" fill="rgba(255,255,255,0.6)"/>
  </g>`;
}
const S = 200, G = 14; // bloco e espaço
// "T" de Tycoon: 3 em cima + 2 descendo, centralizado; e um bloco caindo à direita.
const W3 = 3*S + 2*G, ox = (1024 - W3)/2, oy = 198;
let blocks = '';
blocks += block(ox, oy, S, C.cyan);
blocks += block(ox+S+G, oy, S, C.pink);
blocks += block(ox+2*(S+G), oy, S, C.yellow);
blocks += block(ox+S+G, oy+S+G, S, C.green);
blocks += block(ox+S+G, oy+2*(S+G), S, C.orange);
const defs = `<defs>
  <radialGradient id="bg" cx="50%" cy="38%" r="75%">
    <stop offset="0" stop-color="#4c1d95"/><stop offset="0.45" stop-color="#1e1b4b"/><stop offset="1" stop-color="#050816"/>
  </radialGradient>
  <radialGradient id="glow" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#38bdf8" stop-opacity="0.55"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
  </radialGradient>
  <filter id="drop" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#000" flood-opacity="0.55"/></filter>
  <clipPath id="sq"><rect width="1024" height="1024" rx="${mode==='round'?512:224}"/></clipPath>
</defs>`;
const bgLayer = `<rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="512" cy="500" r="420" fill="url(#glow)"/>
  ${Array.from({length:22},(_,i)=>{const x=(Math.sin(i*91.3)*0.5+0.5)*1024,y=(Math.cos(i*47.7)*0.5+0.5)*1024;return `<circle cx="${x}" cy="${y}" r="${2+(i%3)*1.5}" fill="#fff" opacity="${0.25+(i%4)*0.12}"/>`}).join('')}
`;
// fg (adaptativo): blocos encolhidos para a área segura (66%) do Android.
const fgLayer = mode === 'fg' ? `<g transform="translate(512 512) scale(0.74) translate(-512 -${oy + (3*S+2*G)/2})">${blocks}</g>` : blocks;
document.getElementById('s').innerHTML = defs + (
  mode === 'bg' ? bgLayer :
  mode === 'fg' ? fgLayer :
  mode === 'square' ? bgLayer + blocks :
  `<g clip-path="url(#sq)">${bgLayer}${mode === 'round' ? `<g transform="translate(512 512) scale(0.84) translate(-512 -${oy + (3*S+2*G)/2})">${blocks}</g>` : blocks}<rect width="1024" height="1024" rx="${mode==='round'?512:224}" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="10"/></g>`);
</script></body></html>
