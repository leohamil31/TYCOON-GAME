name: Publicar no GitHub Pages

# Gera a versão web (preview/ + react-native-web) e grava em docs/, que é a pasta servida pelo GitHub Pages.
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Só as dependências da versão web (as nativas do React Native não são necessárias aqui).
      - name: Instalar dependências da web
        run: |
          mkdir -p /tmp/rn-native && mv package.json package-lock.json /tmp/rn-native/
          npm init -y > /dev/null
          npm install --no-audit --no-fund vite@6 @vitejs/plugin-react@4 react@19 react-dom@19 react-native-web@0.21 peerjs@1

      - name: Build
        run: npx vite build preview --base ./ --outDir ../docs --emptyOutDir

      - name: Restaurar package.json
        run: |
          rm -f package.json package-lock.json
          mv /tmp/rn-native/package.json /tmp/rn-native/package-lock.json ./
          touch docs/.nojekyll

      - name: Commit do build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then echo "Sem mudanças no build."; exit 0; fi
          git commit -m "Atualiza build do GitHub Pages"
          git push
