services:
  - type: web
    name: tycoon-game-api-leohamil31
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci && npm run typecheck
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      - key: DATABASE_URL
        sync: false
      - key: ALLOW_SIMULATED_IAP
        value: 'false'
